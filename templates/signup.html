{% extends "base.html" %}
{% block title %}Sign up — InterviewIQ{% endblock %}
{% block content %}
<div class="container auth-wrap">
    <div class="auth-card">
        <h2 class="mb-1">Create your account</h2>
        <p class="muted mb-4">Start practising mock interviews in minutes.</p>
        <form method="post">
            <label class="form-label">Full Name</label>
            <input class="form-control mb-3" type="text" name="name" required>
            <label class="form-label">Email</label>
            <input class="form-control mb-3" type="email" name="email" required>
            <label class="form-label">Password</label>
            <input class="form-control mb-3" type="password" name="password" minlength="6" required>
            <label class="form-label">Confirm Password</label>
            <input class="form-control mb-4" type="password" name="confirm" minlength="6" required>
            <button class="btn btn-main w-100" type="submit">Create account</button>
        </form>
        <p class="mt-3 mb-0 muted">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
    </div>
</div>
{% endblock %}
