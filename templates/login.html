{% extends "base.html" %}
{% block title %}Login — InterviewIQ{% endblock %}
{% block content %}
<div class="container auth-wrap">
    <div class="auth-card">
        <h2 class="mb-1">Welcome back</h2>
        <p class="muted mb-4">Log in to continue your interview practice.</p>
        <form method="post">
            <label class="form-label">Email</label>
            <input class="form-control mb-3" type="email" name="email" required>
            <label class="form-label">Password</label>
            <input class="form-control mb-4" type="password" name="password" required>
            <button class="btn btn-main w-100" type="submit">Log in</button>
        </form>
        <p class="mt-3 mb-0 muted">New here? <a href="{{ url_for('signup') }}">Create an account</a></p>
    </div>
</div>
{% endblock %}
